# Local PostgreSQL. Flyway (in the backend) owns the schema, so no init scripts are mounted here.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: prep_planner
      POSTGRES_USER: prep
      POSTGRES_PASSWORD: prep_local_only   # local development only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prep -d prep_planner"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
